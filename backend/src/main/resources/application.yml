jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # create: 실행할 때마다 테이블을 새로 만듦 (연습용)
      # update: 변경된 부분만 수정해서 반영 (개발용 권장)
      ddl-auto: update
    show-sql: true # 콘솔에 SQL 문이 찍히게 설정
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        packagesToScan: com.example.Piroin.project.domain

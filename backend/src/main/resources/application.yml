spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${RDS_ENDPOINT}:5432/${RDS_DB_NAME}
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 5000

  transaction:
    default-timeout: 30  # 트랜잭션 전체 30s 초과 시 롤백

  flyway:
#    repair-on-migrate: true
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        packagesToScan: com.example.Piroin.project.domain
        jdbc:
          time_zone: Asia/Seoul
        # 슬로우 쿼리 로그 — 1초 이상 걸리는 쿼리를 WARN 레벨로 출력
        generate_statistics: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 1000
        # 쿼리 실행 자체 타임아웃 — 커넥션 획득 후 쿼리가 느린 경우 대응
        javax:
          persistence:
            query:
              timeout: 30000  # 30s 초과 쿼리 예외 발생
  
  jackson:
    time-zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

logging:
  level:
    # 슬로우 쿼리 로그 (1초 이상 쿼리 감지)
    org.hibernate.SQL_SLOW: WARN
    # HikariCP 커넥션 풀 상태 로그
    com.zaxxer.hikari: DEBUG
    com.zaxxer.hikari.HikariConfig: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health

file:
  upload-dir: uploads/

# SSE 연결은 HTTP 커넥션을 끊지 않고 유지
# 연결당 Tomcat 스레드 하나를 점유하므로, 동시 접속자 수를 고려해 스레드 수를 넉넉하게 설정
server:
  tomcat:
    threads:
      max: 200        # 기본값 200 (명시적으로 설정)
      min-spare: 20   # 최소 대기 스레드 수
    # 요청 레벨 타임아웃 — Soak에서 최대 24분 응답 방지
    connection-timeout: 20000   # 커넥션 수립 타임아웃 20s
  servlet:
    session:
      timeout: 30m

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${RDS_ENDPOINT}:5432/${RDS_DB_NAME}
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 5000

  flyway:
#    repair-on-migrate: true
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        packagesToScan: com.example.Piroin.project.domain
        jdbc:
          time_zone: Asia/Seoul
  
  jackson:
    time-zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

management:
  endpoints:
    web:
      exposure:
        include: health

file:
  upload-dir: uploads/

# SSE 연결은 HTTP 커넥션을 끊지 않고 유지
# 연결당 Tomcat 스레드 하나를 점유하므로, 동시 접속자 수를 고려해 스레드 수를 넉넉하게 설정
server:
  tomcat:
    threads:
      max: 200        # 기본값 200 (명시적으로 설정)
      min-spare: 20   # 최소 대기 스레드 수
